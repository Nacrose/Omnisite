version: 2
updates:
  # npm dependencies — weekly, grouped by ecosystem
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Patch + minor updates bundled together (low risk)
      patch-and-minor:
        update-types:
          - patch
          - minor
      # Major updates separate (breaking changes need review)
      major:
        update-types:
          - major
    # Security-critical packages — always update promptly
    allow:
      - dependency-name: '@supabase/supabase-js'
      - dependency-name: '@supabase/ssr'
      - dependency-name: 'next'
      - dependency-name: 'zod'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'

  # GitHub Actions — keep workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
