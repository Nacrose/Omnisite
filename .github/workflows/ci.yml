name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs on the same ref when a new commit is pushed.
# Saves CI minutes and prevents stale builds from overwriting fresh ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + TypeCheck + Test + Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Lint (strict — non-blocking)
        # Reports the warning count. Non-blocking until we pay down the
        # existing 253 warnings (mostly console.* in server-side logging
        # and non-null assertions in tests). Promote to blocking once at 0.
        continue-on-error: true
        run: bun run lint:strict
      - name: Type check
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Test coverage (non-blocking)
        # Generates a coverage report. Non-blocking — thresholds are at 0
        # for now (see vitest.config.ts). Upload the report so we can
        # track the trend over time.
        continue-on-error: true
        run: bun run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      - name: Audit dependencies
        # Fails CI on HIGH/CRITICAL vulns in production-reachable deps.
        # Dev-only transitive vulns (eslint, vitest, etc.) are non-blocking.
        # Known pending upgrades (e.g. recharts 2.x → 3.x to drop lodash) are
        # tracked in scripts/audit.mjs and warned but not blocking.
        run: bun run audit
      - name: Schema drift check
        # Verifies supabase/CURRENT_SCHEMA.md is in sync with the migration
        # files — catches documentation drift when a migration modifies a
        # security-critical function but the doc isn't updated.
        run: bun run schema-check

  build:
    name: Production Build + Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Bundle size guard
        # Fails if total chunk JS exceeds 3500 KB or any single chunk exceeds
        # 1300 KB. See scripts/check-bundle-size.mjs for details.
        run: bun run size-check
      - name: Cache .next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build for E2E
        # Pre-build the app so the e2e job runs `next start` (production
        # server) instead of `next dev` (JIT compilation). Faster + closer
        # to the real deployment.
        run: bun run build
      - name: Install Playwright browsers
        # Install all 3 browsers — playwright.config.ts runs chromium,
        # firefox, and webkit in CI (process.env.CI === '1').
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Run Playwright tests
        run: bunx playwright test --reporter=line
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload Playwright traces
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
